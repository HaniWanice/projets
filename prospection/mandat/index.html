    <symbol id="logo" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="url(#lg)"/><path d="M9 22V11l7 6.5L23 11v11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>

    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M6.5 3.5h3l1.5 4-2 1.5a11 11 0 0 0 6 6l1.5-2 4 1.5v3a2 2 0 0 1-2 2A16 16 0 0 1 4.5 5.5a2 2 0 0 1 2-2z"/></symbol>

<div id="lock" class="lock" hidden>
  <div class="mesh" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <form id="lockForm" class="lock-card" autocomplete="off">
    <svg class="lock-logo" aria-hidden="true"><use href="#logo"/></svg>
    <h1>Mandat</h1>
    <p>Le calendrier des élections CSE 2027.<br>Démo privée.</p>
    <div class="field">
      <input id="pw" type="password" required placeholder="Code d'accès" aria-label="Code d'accès" spellcheck="false" autocomplete="current-password">
      <button class="go" type="submit" id="lockBtn" aria-label="Ouvrir"><svg class="ic" aria-hidden="true"><use href="#i-arrow"/></svg></button>
    </div>
    <p id="lockErr" class="lock-err" role="alert">Code incorrect. Vérifiez les tirets.</p>
    <p class="lock-foot">Demandé une seule fois sur cet appareil.</p>
  </form>
</div>

<div id="app" class="app" hidden>
  <header class="top">
    <a class="brand" href="#/accueil" aria-label="Accueil"><span>Hani.</span></a>
    <nav class="tabs" id="tabs" aria-label="Navigation">
      <span class="tab-ind" id="tabInd" aria-hidden="true"></span>
      <a href="#/accueil" data-view="accueil"><svg class="ic" aria-hidden="true"><use href="#i-home"/></svg><span>Accueil</span></a>
      <a href="#/prospects" data-view="prospects"><svg class="ic" aria-hidden="true"><use href="#i-list"/></svg><span>Prospects</span></a>
      <a href="#/calendrier" data-view="calendrier"><svg class="ic" aria-hidden="true"><use href="#i-cal"/></svg><span>Calendrier</span></a>
      <a href="#/assistant" data-view="assistant"><svg class="ic" aria-hidden="true"><use href="#i-scale"/></svg><span>Assistant</span></a>
      <a href="#/methode" data-view="methode"><svg class="ic" aria-hidden="true"><use href="#i-book"/></svg><span>Méthode</span></a>
    </nav>
    <div class="top-r">
      <button class="kbtn" id="openCmd" type="button" data-tip="Chercher un établissement ou une action"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg><span>Rechercher</span><kbd>Ctrl K</kbd></button>
      
    </div>
  </header>
  <main id="main" class="main" tabindex="-1"></main>
</div>

<div id="session" class="session" hidden role="dialog" aria-modal="true" aria-label="Session d'appels"></div>

<dialog id="sheet" class="sheet" aria-labelledby="sTitle"><div class="sheet-in" id="sheetBody"></div></dialog>

<dialog id="cmd" class="cmd" aria-label="Recherche">
  <div class="cmd-in">
    <label class="cmd-field"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg><input id="cmdIn" placeholder="Établissement, ville, action…" autocomplete="off" spellcheck="false" aria-label="Rechercher"><kbd>Échap</kbd></label>
    <div class="cmd-list" id="cmdList" role="listbox"></div>
  </div>
</dialog>

<div id="curtain" class="curtain" hidden aria-hidden="true">
  <div class="mesh"><i></i><i></i><i></i><i></i></div>
  <div class="c-in"><svg class="c-logo" aria-hidden="true"><use href="#logo"/></svg><span class="c-title" id="curtainTitle">Mandat</span><span class="c-sub" id="curtainSub"></span></div>
</div>
<div id="tip" class="tip" role="tooltip"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="../../shared/live.js"></script>
<script src="data.js"></script>
<script src="vendor/xlsx.mini.min.js" defer></script>
<script src="app.js"></script>
</body>
</html>
